version: '3.8'

services:
  feedback:
    build: .
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=sqlite:///data/feedback.db
      - PORT=8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - RUST_LOG=info
    volumes:
      - feedback-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  feedback-data:
